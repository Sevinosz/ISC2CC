    let currentQuiz = 1;
    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = [];
    let selectedAnswer = null;
    
    const SESSION_KEY = 'isc2_cc_persistent_scores_v3';

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initSession() {
        updateNavbarScores();
        loadQuiz(1);
    }

    function saveScore(quizNum, score, total) {
        // Use localStorage for persistence across reloads/closures
        let scores = JSON.parse(localStorage.getItem(SESSION_KEY)) || {};
        if (!scores[quizNum] || score > scores[quizNum].score) {
            scores[quizNum] = { score: score, total: total };
            localStorage.setItem(SESSION_KEY, JSON.stringify(scores));
        }
        updateNavbarScores();
    }

    function updateNavbarScores() {
        let scores = JSON.parse(localStorage.getItem(SESSION_KEY)) || {};
        let taskbar = document.getElementById('score-taskbar');
        taskbar.innerHTML = '';
        
        for (let i = 1; i <= 5; i++) {
            if (scores[i]) {
                let pct = Math.round((scores[i].score / scores[i].total) * 100);
                let badgeClass = pct >= 70 ? 'passed' : 'failed';
                taskbar.innerHTML += `<span class="badge ${badgeClass} text-dark ms-2 border">Quiz ${i}: ${pct}%</span>`;
            } else {
                taskbar.innerHTML += `<span class="badge bg-light text-secondary ms-2 border">Quiz ${i}: --</span>`;
            }
        }
    }

    function resetAllScores() {
        if(confirm("Are you sure you want to permanently reset all saved quiz scores?")) {
            localStorage.removeItem(SESSION_KEY);
            updateNavbarScores();
        }
    }

    function loadQuiz(quizNum) {
        // Handle Active Tab Styling
        document.querySelectorAll('.quiz-tab').forEach((tab, index) => {
            if (index + 1 === quizNum) {
                tab.classList.add('active');
            } else {
                tab.classList.remove('active');
            }
        });
        
        currentQuiz = quizNum;
        
        // Deep copy and shuffle questions
        let questionsToLoad = JSON.parse(JSON.stringify(rawExamData['set' + quizNum]));
        currentQuestions = shuffleArray(questionsToLoad);
        
        currentIndex = 0;
        userAnswers = [];
        
        document.getElementById('summary-panel').style.display = 'none';
        document.getElementById('quiz-panel').style.display = 'block';
        document.getElementById('module-title').innerText = `Quiz ${quizNum}`;
        
        renderQuestion();
    }
    
    function loadNextQuiz() {
        let nextSet = currentQuiz === 5 ? 1 : currentQuiz + 1;
        loadQuiz(nextSet);
        window.scrollTo(0,0);
    }

    function renderQuestion() {
        const q = currentQuestions[currentIndex];
        selectedAnswer = null;
        
        document.getElementById('question-counter').innerText = `Q: ${currentIndex + 1} / ${currentQuestions.length}`;
        const progressPercent = (currentIndex / currentQuestions.length) * 100;
        document.getElementById('progress-bar').style.width = progressPercent + '%';
        
        document.getElementById('question-text').innerText = q.question;
        
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        
        for (const [key, val] of Object.entries(q.options)) {
            // Using 100% Native Bootstrap Layouts for Mobile Friendliness
            optsContainer.innerHTML += `
                <label class="list-group-item d-flex align-items-center option-label p-3 p-md-4 mb-3 border rounded shadow-sm" id="opt_${key}">
                    <input class="form-check-input me-3 fs-4" type="radio" name="quizOptions" value="${key}" onclick="selectOption('${key}')">
                    <span class="fs-5 option-content"><strong>${key}.</strong> ${val}</span>
                </label>
            `;
        }
        
        document.getElementById('btn-next').disabled = true;
    }

    function selectOption(key) {
        selectedAnswer = key;
        
        document.querySelectorAll('.option-label').forEach(el => {
            el.classList.remove('selected-option');
        });
        document.getElementById('opt_' + key).classList.add('selected-option');
        
        document.getElementById('btn-next').disabled = false;
    }

    function nextQuestion() {
        if (!selectedAnswer) return;
        
        userAnswers.push({
            questionData: currentQuestions[currentIndex],
            selected: selectedAnswer
        });

        currentIndex++;
        if (currentIndex >= currentQuestions.length) {
            showSummary();
        } else {
            renderQuestion();
            window.scrollTo(0, 0);
        }
    }
    
    function showSummary() {
        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('quiz-panel').style.display = 'none';
        document.getElementById('summary-panel').style.display = 'block';
        
        let score = 0;
        let reviewHtml = '';
        
        userAnswers.forEach((ans, idx) => {
            const qData = ans.questionData;
            const isCorrect = ans.selected === qData.correct;
            if(isCorrect) score++;
            
            const userChoiceText = qData.options[ans.selected];
            const correctChoiceText = qData.options[qData.correct];
            
            reviewHtml += `
                <div class="p-3 mb-4 rounded border bg-light shadow-sm">
                    <h5 class="fw-bold fs-5 mb-3">${idx + 1}. ${qData.question}</h5>
                    <div class="d-flex flex-column gap-2">
                        ${isCorrect 
                            ? `<div class="p-2 bg-success bg-opacity-10 text-success border border-success rounded">
                                 <i class="fas fa-check-circle me-2"></i><strong>Your Answer:</strong> ${ans.selected} - ${userChoiceText}
                               </div>` 
                            : `<div class="p-2 bg-danger bg-opacity-10 text-danger border border-danger rounded mb-1">
                                 <i class="fas fa-times-circle me-2"></i><strong>Your Answer:</strong> ${ans.selected} - ${userChoiceText}
                               </div>
                               <div class="p-2 bg-success bg-opacity-10 text-success border border-success rounded">
                                 <i class="fas fa-check-circle me-2"></i><strong>Correct Answer:</strong> ${qData.correct} - ${correctChoiceText}
                               </div>`
                        }
                    </div>
                </div>
            `;
        });
        
        let pct = Math.round((score / currentQuestions.length) * 100);
        document.getElementById('final-score').innerText = score;
        document.getElementById('total-questions').innerText = currentQuestions.length;
        
        let pctText = document.getElementById('score-percentage-text');
        if(pct >= 70) {
            pctText.innerHTML = `Accuracy: <strong class="text-success">${pct}% (Passed)</strong>`;
        } else {
            pctText.innerHTML = `Accuracy: <strong class="text-danger">${pct}% (Failed)</strong>`;
        }
        
        document.getElementById('review-list').innerHTML = reviewHtml;
        
        saveScore(currentQuiz, score, currentQuestions.length);
        window.scrollTo(0, 0);
    }

    // Startup Execution
    window.onload = initSession;
</script>
</body>
</html>
